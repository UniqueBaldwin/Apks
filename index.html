<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Aplicaciones</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 30px;
            color: #e6edf3;
        }
        .download-btn {
            display: block;
            width: 100%;
            background-color: #238636;
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
            transition: background 0.2s, transform 0.1s ease;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .download-btn.secondary {
            background-color: #1f6feb;
            box-shadow: 0 4px 12px rgba(31, 111, 235, 0.3);
        }
        .download-btn:active {
            transform: scale(0.97);
        }
        .download-btn:hover {
            opacity: 0.9;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Selecciona la aplicación que deseas descargar</h1>

        <!-- Botón para Projectivy Launcher -->
        <a href="ProjectivyLauncher-4.71-c95-xda-release.apk" class="download-btn" download>
            📥 Descargar Projectivy Launcher
        </a>

        <!-- Botón para Stream Cloud -->
        <a href="4.8.0.apk" class="download-btn secondary" download>
            📥 Descargar Stream Cloud
        </a>

        <p>Toca el botón de la app que necesites para iniciar la descarga.</p>
    </div>

</body>
</html>
