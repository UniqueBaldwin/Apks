<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Aplicaciones</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 25px;
            color: #ffffff;
        }
        /* ESTILO NEGRO CON ROJO PARA TODOS LOS BOTONES */
        .download-btn {
            display: block;
            width: 100%;
            background-color: #0b0b0b;
            color: #ffffff;
            border: 2px solid #ff3333;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(255, 51, 51, 0.2);
            transition: transform 0.1s ease, background-color 0.2s;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .download-btn:hover {
            background-color: #1a0505;
        }
        .download-btn:active {
            transform: scale(0.97);
        }

        /* CAJA NEGRA CON ROJO PARA EL REPO */
        .repo-box {
            background-color: #0b0b0b;
            border: 2px solid #ff3333;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            box-sizing: border-box;
            text-align: left;
            width: 100%;
        }
        .repo-title {
            color: #ff4444;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
        }
        .repo-input {
            width: 100%;
            background-color: #050505;
            color: #ffcccc;
            border: 1px solid #ff3333;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
            text-align: center;
            outline: none;
        }
        p {
            color: #8b949e;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Selecciona la aplicación o extensión</h1>

        <!-- Botón para Projectivy Launcher -->
        <a href="https://github.com/UniqueBaldwin/Apks/releases/download/Apk2/ProjectivyLauncher-4.71-c95-xda-release.apk" class="download-btn" download>
            📥 Descargar Projectivy Launcher
        </a>

        <!-- Botón para Stream Cloud -->
        <a href="https://github.com/UniqueBaldwin/Apks/releases/download/Apk/Cloudstream-v4.8.0.1.apk" class="download-btn" download>
            📥 Descargar Stream Cloud
        </a>

        <!-- Botón para SmartTube -->
        <a href="https://github.com/yuliskov/SmartTube/releases/download/31.94s/SmartTube_stable_31.94_universal.apk" class="download-btn" download>
            📥 Descargar SmartTube
        </a>

        <!-- Botón para Browsehere -->
        <a href="https://github.com/UniqueBaldwin/Apks/releases/download/Apk3/browsehere-net-app-release.apk" class="download-btn" download>
            📥 Descargar Browsehere
        </a>

        <!-- Botón para GeForce Now -->
        <a href="https://github.com/UniqueBaldwin/Apks/releases/download/Apk4/com.nvidia.geforcenow_6.37.38533849-559621565_minAPI23.arm64-v8a.armeabi-v7a.nodpi._apkmirror.com.apk" class="download-btn" download>
            📥 Descargar GeForce Now
        </a>

        <!-- Caja de texto para el Repo de Storm Ext (Fork redblacker8) -->
        <div class="repo-box">
            <div class="repo-title">⚡ Storm Ext (redblacker8)</div>
            <input type="text" class="repo-input" value="https://raw.githubusercontent.com/redblacker8/storm-ext/refs/heads/builds/repo.json" readonly onclick="this.select();">
        </div>

        <p>Haz clic en el botón de la app para descargar o en el cuadro para seleccionar el enlace.</p>
    </div>

</body>
</html>
